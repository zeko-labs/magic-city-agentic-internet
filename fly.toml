[http_service]
  internal_port = 4411
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "magic_city_data"
  destination = "/app/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
