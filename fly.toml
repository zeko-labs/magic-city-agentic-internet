  ZEKO_RELAYER_URL = "http://127.0.0.1:4412/submit"
  ZEKO_RELAYER_HOST = "127.0.0.1"
  ZEKO_RELAYER_MODE = "mba_mission_registry"
  ZEKO_MISSION_AUTH_REGISTRY_PUBLIC_KEY = "B62qnkR8WFiEJKjSGCDmer8pngPN9i6TNWz7gfErtsWLnyotmUbGe6R"
