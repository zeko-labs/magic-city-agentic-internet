  AUTO_RECOVER_SPONSORED_PROOF_QUEUE = "false"
  SPONSORED_PROOF_QUEUE_BATCH_SIZE = "1"
  SPONSORED_PROOF_QUEUE_WINDOW_MS = "2500"
  SPONSORED_PROOF_QUEUE_SAFE_START_DELAY_MS = "12000"
  SPONSORED_PROOF_QUEUE_RECOVER_FAILED = "false"
